<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio XR - Universidad Militar Nueva Granada</title>
    <!-- Cargamos la última versión estable de A-Frame -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
</head>
<body>
    <a-scene shadow="type: pcfsoft">
        
        <!-- PARTE D: GESTIÓN DE ACTIVOS (Carga de modelos externos) -->
        <a-assets>
            <!-- REEMPLAZA "tu_modelo.glb" por el nombre exacto de tu archivo en la carpeta models -->
            <a-asset-item id="modeloCAD" src="models/modeloIndustrial1.glb"></a-asset-item>
        </a-assets>

        <!-- ENTORNO BÁSICO -->
        <a-sky color="#87CEEB"></a-sky> <!-- Cielo -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#555" metalness="0.5"></a-plane> <!-- Suelo industrial -->

        <!-- PARTE C: MODELADO INDUSTRIAL CON PRIMITIVAS (Lo que pide la guía) -->
        
        <!-- Banda Transportadora Prototipo -->
        <a-entity id="banda" position="-3 0 -5">
            <a-box position="0 0.4 0" width="4" height="0.1" depth="0.8" color="#222"></a-box> <!-- Superficie -->
            <a-box position="-1.8 0.2 0" width="0.1" height="0.4" depth="0.1" color="#444"></a-box> <!-- Pata 1 -->
            <a-box position="1.8 0.2 0" width="0.1" height="0.4" depth="0.1" color="#444"></a-box> <!-- Pata 2 -->
            <!-- Paquete animado sobre la banda -->
            <a-box position="-1.5 0.55 0" width="0.4" height="0.4" depth="0.4" color="#D2691E"
                   animation="property: position; from: -1.5 0.55 0; to: 1.5 0.55 0; dur: 5000; loop: true">
            </a-box>
        </a-entity>

        <!-- Tanque de Almacenamiento Prototipo -->
        <a-entity id="tanque_primitiva" position="3 0 -6">
            <a-cylinder radius="0.8" height="2.5" color="#2F4F4F"></a-cylinder>
            <a-sphere position="0 1.4 0" radius="0.2" color="#FF0000" 
                      animation="property: material.color; from: #FF0000; to: #00FF00; dur: 2000; dir: alternate; loop: true">
            </a-sphere> <!-- Luz de estado parpadeante -->
        </a-entity>

        <!-- PARTE D: INTEGRACIÓN DEL MODELO CAD DE SOLIDWORKS -->
        <!-- Ajusta la posición (position) y la escala (scale) según necesites -->
        <a-entity id="miModeloSolidWorks" 
                  gltf-model="#modeloCAD" 
                  position="0 0 -8" 
                  scale="0.01 0.01 0.01" 
                  rotation="0 45 0">
        </a-entity>

        <!-- ILUMINACIÓN (Clave para que el modelo CAD se vea metálico y bien definido) -->
        <a-light type="ambient" color="#FFF" intensity="0.7"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.8" position="-1 4 2" castShadow="true"></a-light>

        <!-- CÁMARA Y CONTROLES (Para moverte con WASD o en VR) -->
        <a-entity id="rig" position="0 1.6 0">
            <a-camera look-controls wasd-controls></a-camera>
        </a-entity>

    </a-scene>
</body>
</html>
